##################
### LOCKSCREEN ###
##################

$fontFam = JetBrainsMono Nerd Font
$fontFamB = $fontFam bold
$fontFamI = $fontFam italic
$fontFamC = $fontFam bold italic

# GENERAL
general {
  no_fade_in = false
  grace = 0
  disable_loading_bar = false
  source = $HOME/.config/hypr/hyprlockColor.conf
}

animations {
	enabled = true
	bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 5, linear
  animation = fadeOut, 1, 5, linear
  animation = inputFieldDots, 1, 2, linear
}

# BACKGROUND
background {
  path = $HOME/.cache/setWallpaper_last_image_symlink
  blur_passes = 1
  blur_size = 1
  brightness = 0.2
  contrast = 1.5
  vibrancy = 0.9
}

# USER AVATAR
image {
	monitor = DP-3
	path = $HOME/.face/profile.jpg
	border_size = 2
	border_color = $primaryColor
	size = 250
	rounding = -1
	position = 0, -50
	halign = center
	valign = center
}

# INPUT FIELD
input-field {
	monitor = DP-3
  size = 200, 90
  outline_thickness = 2
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  outer_color = $primaryColor
  inner_color = rgba(18,18,18,0.7)
  font_color = rgba(181, 181, 181,1) 
  fade_on_empty = true
  
  font_size = 1
  placeholder_text = #🔒
  fail_text= ❌
  hide_input = false
  position = 0, -300
  halign = center
  valign = center
}

# TIME
label {
	monitor = DP-3
  text = $TIME
  color = $primaryColor
  shadow_pass = 2
  shadow_size = 3
  shadow_color = rgb(0,0,0)
  shadow_boost = 1.2
  font_size = 250
  font_family = $fontFam
  position = 0, -100
  halign = center
  valign = top
}

# DATE
label {
	monitor = DP-3
  text = cmd[update:60000] date +"%A, %d %B %Y"
  color = $primaryColor
  font_size = 25
  font_family = $fontFam
  position = 0, 200
  halign = center
  valign = center
}

# SYSTEM_STATS
label {
  monitor = DP-1
  text = cmd[update:2000] $HOME/.config/bin/utils/hardwareStats
  border_size = 2
	border_color = $primaryColor
	size = 200
	rounding = -1
	position = 0, -50
	halign = center
	valign = center
}

# MEDIA

# COVER
image {
	monitor = DP-3
  path = /tmp/songcover.jpg

  size = 250
  rounding = 20
  border_size = 2
  border_color = $primaryColor
  opacity = 1.0

  reload_time = 1

  halign = center
  valign = bottom
  position = -250, 70
}

# Title
label {
  monitor = DP-3
  text = cmd[update:1000] $HOME/.config/bin/utils/songmeta.sh title $player
  halign = center
  valign = bottom
  position = 200, 250          
  color = rgba(0.90, 0.95, 1.0, 1.0)
  font_size = 30
  shadow_size = 2
  shadow_color = rgba(0, 0, 0, 0.7)
  font_family = $fontFam
}

# Artist
label {
  monitor = DP-3
  text = cmd[update:1000] $HOME/.config/bin/utils/songmeta.sh artist $player
  halign = center
  valign = bottom
  position = 200, 175          
  color = rgba(0.80, 0.90, 1.0, 1.0)
  font_size = 20
  shadow_size = 2
  shadow_color = rgba(0, 0, 0, 0.7)
  font_family = $fontFam
}

# Album
label {
  monitor = DP-3
  text = cmd[update:1000] $HOME/.config/bin/utils/songmeta.sh album $player
  halign = center
  valign = bottom
  position = 200, 110
            
  color = rgba(0.70, 0.85, 1.0, 0.95)
  font_size = 15
  shadow_size = 2
  shadow_color = rgba(0, 0, 0, 0.7)
  font_family = $fontFam
}


label {
  monitor = DP-3
  text = ◃◃
  position = -75, 15
  halign = center
  valign = bottom
  font_size = 28
  onclick = playerctl previous
}

label {
  monitor = DP-3
  text = ||
  position = 0, 15
  halign = center
  valign = bottom
  font_size = 28
  onclick = playerctl play-pause
}

label {
  monitor = DP-3
  text = ▹▹
  position = 75, 15
  halign = center
  valign = bottom
  font_size = 28
  onclick = playerctl next
}

